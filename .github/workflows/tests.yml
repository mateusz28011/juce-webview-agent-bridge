name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Zero-dependency Node suites (client, page helpers, capture script).
  js:
    name: js (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # a failure on one cell must not cancel the others' signal
      matrix:
        include:
          # 22 = the engines floor, 24 = current LTS; windows/macos each get one
          # Node-24 cell so the suite is proven cross-platform without tripling
          # the matrix.
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Build and type-check the published client
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npm ci --ignore-scripts
          npm run build
          git diff --exit-code -- tools/
          npm run test:types

  # C++ bridge suite against a real loopback server, on all three platforms.
  # All required: the suite went green on Windows/Linux in CI run 2, so those
  # columns gate the build like macOS does (live-app usage on them is still
  # unverified — see README "Status" — but the suite itself must stay green).
  cpp:
    name: cpp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install JUCE Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype6-dev libfontconfig1-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev pkg-config ninja-build xvfb

      # JUCE + Catch2 are FetchContent'd on first configure — cache the sources
      # so re-runs skip the ~200MB JUCE clone.
      - name: Cache FetchContent deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S tests -B build/test -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test --config Release --parallel 4

      - name: Test (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build/test -C Release --output-on-failure

      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir build/test -C Release --output-on-failure
